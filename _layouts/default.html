<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.intro }}">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="https://ccvprodrock.blob.core.windows.net/filestore/Themes/church_ccv_External_v9/Assets/Icons/favicon.ico">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="logo">CCV</span><span class="brand-sub">Production</span></a>
      <a class="bar-link" href="https://ccv.church">ccv.church &rarr;</a>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: "%Y" }} CCV. Thank you for serving.</p>
    </div>
  </footer>
</body>
</html>
